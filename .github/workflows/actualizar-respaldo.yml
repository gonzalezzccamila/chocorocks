name: Actualizar respaldo del catálogo

on:
  schedule:
    - cron: "0 9 * * *" # todos los días a las 6:00 de Buenos Aires
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/actualizar_respaldo.py
      - name: Guardar si cambió
        run: |
          if git diff --quiet; then
            echo "Sin cambios."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Actualizar respaldo del catálogo"
            git push
          fi
